name: Tests

on:
  push:
    branches: ["master"]
  pull_request:
  # Callable, so a release runs exactly these checks against the tag it is about to publish
  # rather than a copy of them that can drift.
  workflow_call:
    inputs:
      test_scope:
        type: string
        required: false
        default: all
      revision:
        type: string
        required: false
        default: ''
    outputs:
      artifact_digest:
        description: SHA-256 digest of the verified production artifact archive
        value: ${{ jobs.build.outputs.artifact_digest }}
      revision:
        description: Exact checked revision
        value: ${{ jobs.build.outputs.revision }}

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The guard reads every commit the push or pull request brings, not only the tip.
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false

      - name: Verify exact revision
        env:
          REVISION: ${{ inputs.revision || github.sha }}
        run: |
          [[ "$REVISION" =~ ^[a-f0-9]{40}$ ]] && [ "$(git rev-parse HEAD)" = "$REVISION" ]
          [ "$REVISION" = "$GITHUB_SHA" ]

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.23.4"

      # Nothing extraneous and no credentials: the tree as it is, then each new commit on its
      # own, because a secret added in one commit and deleted in the next is still published.
      # Needs no dependencies. See docs/Repository guard.md.
      - name: Repository guard
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          CANDIDATE_REVISION: ${{ inputs.revision }}
        run: |
          node plugin/scripts/repo-guard.mjs --all
          base=""
          if [ "$EVENT" = "pull_request" ]; then base="$PR_BASE"; fi
          if [ "$EVENT" = "push" ]; then base="$PUSH_BEFORE"; fi
          if [ -n "$CANDIDATE_REVISION" ]; then base=$(git merge-base origin/master HEAD); fi
          if [ -n "$base" ] && [ "$base" != "0000000000000000000000000000000000000000" ] \
            && git cat-file -e "$base^{commit}" 2>/dev/null; then
            node plugin/scripts/repo-guard.mjs --range "$base..HEAD"
          fi

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - name: Verify exact revision
        env:
          REVISION: ${{ inputs.revision || github.sha }}
        run: |
          [[ "$REVISION" =~ ^[a-f0-9]{40}$ ]] && [ "$(git rev-parse HEAD)" = "$REVISION" ]
          [ "$REVISION" = "$GITHUB_SHA" ]
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.23.4"
          cache: npm
          cache-dependency-path: plugin/package-lock.json
      - name: Install dependencies
        working-directory: plugin
        run: npm ci --ignore-scripts

      - name: Audit shipped dependencies
        working-directory: plugin
        run: npm audit --omit=dev --audit-level=moderate

      # Advisory only: dynamic registration and script APIs must be reviewed before deletion.
      - name: Dead-code inventory
        working-directory: plugin
        run: node scripts/dead-code.mjs

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - name: Verify exact revision
        env:
          REVISION: ${{ inputs.revision || github.sha }}
        run: |
          [[ "$REVISION" =~ ^[a-f0-9]{40}$ ]] && [ "$(git rev-parse HEAD)" = "$REVISION" ]
          [ "$REVISION" = "$GITHUB_SHA" ]
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        id: node
        with:
          node-version: "22.23.4"
          cache: npm
          cache-dependency-path: plugin/package-lock.json
      - name: Install dependencies
        working-directory: plugin
        run: npm ci --ignore-scripts
      # Typed rules also read imported declarations and external rule inputs. A per-file
      # content cache alone is not safe: reuse only for an identical complete checkout,
      # locked dependencies and runtime, never a fallback key from another tree.
      - name: Fingerprint complete lint inputs
        id: lint_inputs
        run: echo "tree=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: plugin/node_modules/.cache/eslint/ci
          key: eslint-content-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.node.outputs.node-version }}-${{ hashFiles('plugin/package-lock.json') }}-${{ hashFiles('plugin/eslint.config.mjs', 'plugin/.prettierrc.mjs') }}-${{ steps.lint_inputs.outputs.tree }}

      # Obsidian's own plugin rules, from eslint-plugin-obsidianmd. Warnings are pre-existing
      # TypeScript hygiene and do not fail the build; an error means a guideline was broken.
      - name: Lint
        working-directory: plugin
        env:
          ABELE_LINT_CONCURRENCY: "2"
        run: npm run lint:ci

  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - name: Verify exact revision
        env:
          REVISION: ${{ inputs.revision || github.sha }}
        run: |
          [[ "$REVISION" =~ ^[a-f0-9]{40}$ ]] && [ "$(git rev-parse HEAD)" = "$REVISION" ]
          [ "$REVISION" = "$GITHUB_SHA" ]
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.23.4"
          cache: npm
          cache-dependency-path: plugin/package-lock.json
      - name: Install dependencies
        working-directory: plugin
        run: npm ci --ignore-scripts

      # Obsidian's preset exactly as the community review runs it. Only the suppression rules
      # are gated: the review reports an `eslint-disable` of one of its own rules as a Risk and
      # rejects the submission, and a green main lint gate does not catch that.
      - name: No suppressions of Obsidian's rules
        working-directory: plugin
        run: |
          found=$(npm run --silent lint:review 2>&1 | grep 'eslint-comments/' || true)
          if [ -n "$found" ]; then
            echo "The community review rejects these as Risks:"
            echo "$found"
            exit 1
          fi
          echo "No suppressions of Obsidian's rules."

  test:
    name: test (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - name: Verify exact revision
        env:
          REVISION: ${{ inputs.revision || github.sha }}
        run: |
          [[ "$REVISION" =~ ^[a-f0-9]{40}$ ]] && [ "$(git rev-parse HEAD)" = "$REVISION" ]
          [ "$REVISION" = "$GITHUB_SHA" ]
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.23.4"
          cache: npm
          cache-dependency-path: plugin/package-lock.json
      - name: Install dependencies
        working-directory: plugin
        run: npm ci --ignore-scripts

      # Unit and integration tiers only. The e2e tier drives a running Obsidian desktop app
      # through its CLI and has no meaning on a headless runner.
      - name: Unit and integration tests
        working-directory: plugin
        env:
          TEST_SCOPE: ${{ inputs.test_scope || 'all' }}
          SHARD: ${{ matrix.shard }}
          SHARD_COUNT: 4
        run: |
          case "${TEST_SCOPE:-all}" in
            all) npm test -- --shard="$SHARD/$SHARD_COUNT" --maxWorkers=2 ;;
            key-destinations) npm run test:key-destinations -- --shard="$SHARD/$SHARD_COUNT" --maxWorkers=2 ;;
            *) echo "Unknown test scope" >&2; exit 1 ;;
          esac

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - name: Verify exact revision
        env:
          REVISION: ${{ inputs.revision || github.sha }}
        run: |
          [[ "$REVISION" =~ ^[a-f0-9]{40}$ ]] && [ "$(git rev-parse HEAD)" = "$REVISION" ]
          [ "$REVISION" = "$GITHUB_SHA" ]
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.23.4"
          cache: npm
          cache-dependency-path: plugin/package-lock.json
      - name: Install dependencies
        working-directory: plugin
        run: npm ci --ignore-scripts
      - name: Type check
        working-directory: plugin
        run: npm run types
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: types
          path: plugin/node_modules/.cache/abele/types.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # The type evidence gates build-only; build/size overlaps tests, lint and audit.
  build:
    needs: types
    runs-on: ubuntu-latest
    outputs:
      artifact_digest: ${{ steps.artifact.outputs.artifact-digest }}
      revision: ${{ steps.revision.outputs.revision }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - name: Verify exact revision
        id: revision
        env:
          REVISION: ${{ inputs.revision || github.sha }}
        run: |
          [[ "$REVISION" =~ ^[a-f0-9]{40}$ ]] && [ "$(git rev-parse HEAD)" = "$REVISION" ]
          [ "$REVISION" = "$GITHUB_SHA" ]
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.23.4"
          cache: npm
          cache-dependency-path: plugin/package-lock.json
      - name: Install dependencies
        working-directory: plugin
        run: npm ci --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: types
          path: plugin/node_modules/.cache/abele
      - name: Build production once
        working-directory: plugin
        run: npm run build:verified
      - name: Bundle size
        working-directory: plugin
        env:
          ABELE_BUILD_ARTIFACT: build
        run: npm run test:size
      - name: Verify production release assets
        working-directory: plugin
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          export TAG="${RELEASE_TAG:-$(node -p 'JSON.parse(require("fs").readFileSync("../manifest.json")).version')}"
          node scripts/check-release.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        id: artifact
        with:
          name: production
          path: plugin/build/
          if-no-files-found: error
          retention-days: 1
