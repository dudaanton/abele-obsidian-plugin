name: Tests

on:
  push:
    branches: ["master"]
  pull_request:
  # Callable, so a release runs exactly these checks against the tag it is about to publish
  # rather than a copy of them that can drift.
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # The guard reads every commit the push or pull request brings, not only the tip.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: plugin/package-lock.json

      # Nothing extraneous and no credentials: the tree as it is, then each new commit on its
      # own, because a secret added in one commit and deleted in the next is still published.
      # Needs no dependencies. See docs/Repository guard.md.
      - name: Repository guard
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          node plugin/scripts/repo-guard.mjs --all
          base=""
          if [ "$EVENT" = "pull_request" ]; then base="$PR_BASE"; fi
          if [ "$EVENT" = "push" ]; then base="$PUSH_BEFORE"; fi
          if [ -n "$base" ] && [ "$base" != "0000000000000000000000000000000000000000" ] \
            && git cat-file -e "$base^{commit}" 2>/dev/null; then
            node plugin/scripts/repo-guard.mjs --range "$base..HEAD"
          fi

      - name: Install dependencies
        working-directory: plugin
        run: npm ci

      - name: Type check
        working-directory: plugin
        run: npm run types

      # Obsidian's own plugin rules, from eslint-plugin-obsidianmd. Warnings are pre-existing
      # TypeScript hygiene and do not fail the build; an error means a guideline was broken.
      - name: Lint
        working-directory: plugin
        run: npm run lint

      # Obsidian's preset exactly as the community review runs it. Only the suppression rules
      # are gated: the review reports an `eslint-disable` of one of its own rules as a Risk and
      # rejects the submission, and a green `npm run lint` above does not catch that.
      - name: No suppressions of Obsidian's rules
        working-directory: plugin
        run: |
          found=$(npm run --silent lint:review 2>&1 | grep 'eslint-comments/' || true)
          if [ -n "$found" ]; then
            echo "The community review rejects these as Risks:"
            echo "$found"
            exit 1
          fi
          echo "No suppressions of Obsidian's rules."

      # Unit and integration tiers only. The e2e tier drives a running Obsidian desktop app
      # through its CLI and has no meaning on a headless runner.
      - name: Unit and integration tests
        working-directory: plugin
        run: npm test

      # Builds the production bundle and holds main.js and the stylesheet to the budget in
      # plugin/tests/size/budget.json. Every byte of main.js is read and compiled at every start.
      - name: Bundle size
        working-directory: plugin
        run: npm run test:size
