name: Verify release candidate

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Exact 40-character commit SHA of the release candidate
        type: string
        required: true

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/test.yml
    with:
      revision: ${{ inputs.revision }}
      test_scope: all

  record:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Record verified candidate and artifact digest
        env:
          REVISION: ${{ inputs.revision }}
          VERIFIED_REVISION: ${{ needs.verify.outputs.revision }}
          ARTIFACT_DIGEST: ${{ needs.verify.outputs.artifact_digest }}
        run: |
          [[ "$REVISION" =~ ^[a-f0-9]{40}$ ]] && [ "$REVISION" = "$VERIFIED_REVISION" ]
          [[ "$ARTIFACT_DIGEST" =~ ^[a-f0-9]{64}$ ]]
          printf '{"revision":"%s","artifact_digest":"%s"}\n' "$REVISION" "$ARTIFACT_DIGEST" > candidate.json
          printf 'Verified revision: `%s`\n\nProduction artifact SHA-256: `%s`\n' "$REVISION" "$ARTIFACT_DIGEST" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: candidate-verification
          path: candidate.json
          if-no-files-found: error
          retention-days: 7
