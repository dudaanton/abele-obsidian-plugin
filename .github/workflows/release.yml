name: Release Obsidian Plugin

on:
  push:
    tags:
      - "*"

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      run_id: ${{ steps.evidence.outputs.run_id }}
      artifact_digest: ${{ steps.evidence.outputs.artifact_digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Find completed exact-revision candidate evidence
        id: evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: node plugin/scripts/select-candidate.mjs --github-output "$GITHUB_OUTPUT"

  test:
    needs: candidate
    if: ${{ needs.candidate.outputs.run_id == '' }}
    uses: ./.github/workflows/test.yml
    with:
      # One urgent key-destination release uses its curated regression set; every other tag
      # retains the full suite. Type, lint, dependency, size and publishing gates are unchanged.
      test_scope: ${{ github.ref_name == '1.69.0' && 'key-destinations' || 'all' }}

  build:
    needs: [candidate, test]
    if: ${{ always() && needs.candidate.result == 'success' && (needs.test.result == 'success' || (needs.test.result == 'skipped' && needs.candidate.outputs.run_id != '')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      provenance_sha256: ${{ steps.assets.outputs.provenance_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The production build generates its changelog from the complete tagged history.
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.23.4"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: production
          path: plugin/build
          run-id: ${{ needs.candidate.outputs.run_id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify immutable production archive digest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ needs.candidate.outputs.run_id || github.run_id }}
          EXPECTED_ARTIFACT_DIGEST: ${{ needs.candidate.outputs.artifact_digest || needs.test.outputs.artifact_digest }}
        run: |
          [[ "$EXPECTED_ARTIFACT_DIGEST" =~ ^[a-f0-9]{64}$ ]]
          artifact_id=$(gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts" --jq '.artifacts[] | select(.name == "production" and .expired == false) | .id')
          [[ "$artifact_id" =~ ^[0-9]+$ ]]
          archive="$RUNNER_TEMP/production.zip"
          gh api "repos/$REPO/actions/artifacts/$artifact_id/zip" > "$archive"
          printf '%s  %s\n' "$EXPECTED_ARTIFACT_DIGEST" "$archive" | sha256sum -c -
          mkdir "$RUNNER_TEMP/production-verified"
          unzip -q "$archive" -d "$RUNNER_TEMP/production-verified"
          diff -r "$RUNNER_TEMP/production-verified" plugin/build

      - name: Build and verify production assets
        working-directory: plugin
        env:
          TAG: ${{ github.ref_name }}
          ABELE_PROMOTION_TAG: ${{ needs.candidate.outputs.run_id != '' && github.ref_name || '' }}
        run: |
          # Project validation remains read-only; reuse the size-tested CI bytes.
          node scripts/check-release.mjs

      - name: Collect assets and checksums
        id: assets
        env:
          ABELE_PROMOTION_TAG: ${{ needs.candidate.outputs.run_id != '' && github.ref_name || '' }}
        run: |
          node plugin/scripts/export-release-artifact.mjs plugin/build release
          (cd release && sha256sum -c SHA256SUMS)
          echo "provenance_sha256=$(sha256sum release/provenance.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release
          path: release/
          if-no-files-found: error
          retention-days: 1

  # No package installation or project code runs with repository-write permissions.
  publish:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release
          path: release

      - name: Verify the downloaded assets
        env:
          EXPECTED_PROVENANCE_SHA256: ${{ needs.build.outputs.provenance_sha256 }}
        run: |
          (cd release && sha256sum -c SHA256SUMS)
          [[ "$EXPECTED_PROVENANCE_SHA256" =~ ^[a-f0-9]{64}$ ]]
          printf '%s  release/provenance.json\n' "$EXPECTED_PROVENANCE_SHA256" | sha256sum -c -

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/main.js
            release/manifest.json
            release/styles.css
            release/abele-i18n-*.json
            release/provenance.json

      - name: Publish release with checksums
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          prev_tag=$(git tag --sort=-v:refname | grep -Fxv "$TAG" | head -n 1 || true)
          if [ -n "$prev_tag" ]; then
            changelog=$(git log "${prev_tag}..${TAG}" --pretty=format:"- %h %s" --no-merges)
          else
            changelog=$(git log --pretty=format:"- %h %s" --no-merges)
          fi
          fence='```'
          notes=$(printf '%s\n\n### SHA-256\n\n%s\n%s\n%s\n\nVerify build provenance: gh attestation verify main.js --repo %s\n' \
            "$changelog" "$fence" "$(cat release/SHA256SUMS)" "$fence" "$REPO")
          gh release create "$TAG" \
            --title="$TAG" \
            --notes="$notes" \
            release/main.js \
            release/manifest.json \
            release/styles.css \
            release/abele-i18n-ru.json \
            release/abele-i18n-lv.json \
            release/abele-i18n-es.json \
            release/abele-i18n-de.json \
            release/SHA256SUMS
