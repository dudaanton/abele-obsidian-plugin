name: Release Obsidian Plugin

on:
  push:
    tags:
      - "*"

jobs:
  test:
    uses: ./.github/workflows/test.yml

  release:
    # Nothing is published unless the tagged code type-checks and passes its tests.
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Build plugin
        working-directory: plugin
        run: |
          npm ci
          npm run build

      # The release publishes three files. A build that emits anything else has split a
      # dynamic import into a chunk that would never reach a vault, leaving whatever sits
      # behind that import broken for every user.
      - name: Check the build is one file
        working-directory: plugin
        run: |
          unexpected=$(ls build | grep -vE '^(main\.js|main\.css|styles\.css)$' || true)
          if [ -n "$unexpected" ]; then
            echo "Unexpected build output, which the release would not publish:"
            echo "$unexpected"
            exit 1
          fi

      - name: Create release with changelog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"

          prev_tag=$(git tag --sort=-v:refname | grep -v "^${tag}$" | head -n 1)

          if [ -n "$prev_tag" ]; then
            changelog=$(git log "${prev_tag}..${tag}" --pretty=format:"- %h %s" --no-merges)
          else
            changelog=$(git log --pretty=format:"- %h %s" --no-merges)
          fi

          cp plugin/build/main.css plugin/build/styles.css

          gh release create "$tag" \
            --title="$tag" \
            --notes="$changelog" \
            plugin/build/main.js \
            manifest.json \
            plugin/build/styles.css
